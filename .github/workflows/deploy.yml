name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild (space-separated, or "all")'
        required: false
        default: 'all'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy over SSH
        env:
          SERVICES_INPUT: ${{ github.event.inputs.services }}
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          SERVICES="$SERVICES_INPUT"
          if [ -z "$SERVICES" ] || [ "$SERVICES" = "all" ]; then
            SERVICES="api-admin api-auth api-driver api-gateway api-logistics api-operations api-supplier web-admin web-operations web-logistics web-supplier"
          fi

          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<EOF
            set -e
            cd ~/conntrack-new

            echo "=== Pulling latest main ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Building: $SERVICES ==="
            for svc in $SERVICES; do
              echo "--- Building \$svc ---"
              docker compose build "\$svc"
            done

            echo "=== Restarting services ==="
            docker compose up -d $SERVICES

            echo "=== Current status ==="
            docker compose ps
          EOF
