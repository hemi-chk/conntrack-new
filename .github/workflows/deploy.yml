name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild (space-separated, or "all")'
        required: false
        default: 'all'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd ~/conntrack-new

            echo "=== Pulling latest main ==="
            git fetch origin
            git reset --hard origin/main

            SERVICES="${{ github.event.inputs.services }}"
            if [ -z "$SERVICES" ] || [ "$SERVICES" = "all" ]; then
              SERVICES="api-admin api-auth api-driver api-gateway api-logistics api-operations api-supplier web-admin web-operations web-logistics web-supplier"
            fi

            echo "=== Building: $SERVICES ==="
            for svc in $SERVICES; do
              echo "--- Building $svc ---"
              docker compose build "$svc"
            done

            echo "=== Restarting services ==="
            docker compose up -d $SERVICES

            echo "=== Current status ==="
            docker compose ps
